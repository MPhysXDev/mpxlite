[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mpxlite"
dynamic = ["version"]
description = "Internal package of MPhysX."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "MPhysX", email = "contact@mphysx.com" },
]
maintainers = [
    { name = "MPhysX", email = "contact@mphysx.com" },
]
# The Python distributions contain MIT code only: tools/ (the engine build script, the
# bundle tools, CI scripts and the GPL-2.0-or-later GetDP patch) is excluded from them
# (see [tool.hatch.build.targets.sdist]).
license = "MIT"
license-files = ["LICENSE", "COPYRIGHT.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
]
dev = [
    "ruff>=0.4",
    "nox>=2024.3.2",
    "build>=1.0",
    "mpxlite[test]",
]

[project.urls]
Homepage = "https://github.com/MPhysXDev/mpxlite"
Repository = "https://github.com/MPhysXDev/mpxlite.git"
Issues = "https://github.com/MPhysXDev/mpxlite/issues"
Changelog = "https://github.com/MPhysXDev/mpxlite/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mpxlite/__init__.py"

[tool.hatch.build.targets.sdist]
# The sdist is the Python package (with its tests). The engine tooling (tools/:
# build script, bundle generator, installer, CI scripts) and the GetDP patch it needs
# (GPL-2.0-or-later, tools/getdp/patches/) live in the repository and in every release
# bundle (source/), not in the Python distributions; nor does the CI configuration.
exclude = ["/tools", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/mpxlite"]

[tool.hatch.build.targets.wheel.force-include]
"src/mpxlite/tools/getdp_runner.sh" = "mpxlite/tools/getdp_runner.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: runs the real getdp binary, systemd or mpirun (skipped when missing; deselected by `nox -s tests`, run by `nox -s integration`)",
]

[tool.coverage.run]
source = ["mpxlite"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
