# CI workflow for mpxlite: lint and multi-Python tests with coverage.
# Runs on every push, every PR to main, and once a day at 06:00 UTC.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # daily build at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  checks: write          # required by dorny/test-reporter
  pull-requests: write   # so test report comments can be attached to PRs

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install nox
        run: pip install --upgrade pip && pip install nox
      - name: Run lint
        run: nox -s lint

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install nox
        run: pip install --upgrade pip && pip install nox
      - name: Run tests
        run: nox -s "tests-${{ matrix.python-version }}"
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
      - name: Upload coverage XML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload coverage HTML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: pytest (Python ${{ matrix.python-version }})
          path: junit.xml
          reporter: java-junit
          fail-on-error: false
